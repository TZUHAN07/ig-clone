<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat • IG-Clone</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png" />
    <link rel="manifest" href="../assets/site.webmanifest" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/sidebar.css" />
    <link rel="stylesheet" href="../assets/css/chat.css" />
  </head>
 <body>
  <div class="sidebar-container"></div>

  <main class="chat-container">
    <aside class="conversation-list">
      <h2>Messages</h2>
      <ul id="conversation-list">
        <li class="empty">載入中...</li>
      </ul>
    </aside>

    <section class="message-area">
      <header id="chat-header" class="hidden">
         <button class="mobile-back-btn" aria-label="Back">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
              <path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/>
            </svg>
         </button>
        <a id="chat-user-link" href="#" class="chat-user-link">
          <img id="chat-avatar" src="" alt="" />
          <span id="chat-username"></span>
        </a>
      </header>

      <div id="message-list" class="message-list">
        <div class="empty-state">
          <div class="empty-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
              <path d="M568.4 37.7C578.2 34.2 589 36.7 596.4 44C603.8 51.3 606.2 62.2 602.7 72L424.7 568.9C419.7 582.8 406.6 592 391.9 592C377.7 592 364.9 583.4 359.6 570.3L295.4 412.3C290.9 401.3 292.9 388.7 300.6 379.7L395.1 267.3C400.2 261.2 399.8 252.3 394.2 246.7C388.6 241.1 379.6 240.7 373.6 245.8L261.2 340.1C252.1 347.7 239.6 349.7 228.6 345.3L70.1 280.8C57 275.5 48.4 262.7 48.4 248.5C48.4 233.8 57.6 220.7 71.5 215.7L568.4 37.7z"/>
            </svg>
          </div>
          <h3>Your messages</h3>
          <p>Send a message to start a chat.</p>
        </div>
      </div>

      <form id="message-form" class="hidden">
        <input
          type="text"
          id="message-input"
          placeholder="Message..."
          maxlength="1000"
          autocomplete="off"
        />
        <button type="submit" aria-label="Send">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="20" height="20">
            <path d="M568.4 37.7C578.2 34.2 589 36.7 596.4 44C603.8 51.3 606.2 62.2 602.7 72L424.7 568.9C419.7 582.8 406.6 592 391.9 592C377.7 592 364.9 583.4 359.6 570.3L295.4 412.3C290.9 401.3 292.9 388.7 300.6 379.7L395.1 267.3C400.2 261.2 399.8 252.3 394.2 246.7C388.6 241.1 379.6 240.7 373.6 245.8L261.2 340.1C252.1 347.7 239.6 349.7 228.6 345.3L70.1 280.8C57 275.5 48.4 262.7 48.4 248.5C48.4 233.8 57.6 220.7 71.5 215.7L568.4 37.7z"/>
          </svg>
        </button>
      </form>
    </section>
  </main>
 
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="../config.js"></script>
  <script src="../src/utils/storage.js"></script>
  <script src="../src/utils/apiFetch.js"></script>
  <script src="../src/utils/helpers.js"></script>
  <script src="../src/api/avatarApi.js"></script>
  <script src="../src/api/userApi.js"></script>
  <script src="../src/api/chatApi.js"></script>
  <script src="../src/components/sidebar.js"></script>
  <script src="../src/page/chat.js"></script>

</body>
</html>
