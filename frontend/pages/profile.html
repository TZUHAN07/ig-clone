<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile • IG-Clone</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png" />
    <link rel="manifest" href="../assets/site.webmanifest" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/sidebar.css" />
    <link rel="stylesheet" href="../assets/css/profile.css" />
    <link rel="stylesheet" href="../assets/css/comment.css" />
  </head>
  <body>
    <div class="sidebar-container"></div>

    <div class="profile-topbar" id="profile-topbar" style="display: none">
      <span class="topbar-title"></span>
      <button class="hamburger-btn" id="hamburger-btn">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      <div class="hamburger-menu" id="hamburger-menu">
        <button class="menu-item logout-item" id="menu-logout">Logout</button>
      </div>
    </div>

    <main class="profile-container">
      <div class="profile-header">
        <img class="profile-avatar" />
        <div class="profile-info">
          <span class="profile-username"></span>
          <div class="profile-numbers">
            <div class="profile-stat">
              <strong class="stat-count"></strong>
              <span class="stat-label">posts</span>
            </div>

            <div class="profile-stat">
              <strong class="stat-count"></strong>
              <span class="stat-label">followers</span>
            </div>

            <div class="profile-stat">
              <strong class="stat-count"></strong>
              <span class="stat-label">following</span>
            </div>
          </div>
        </div>
      </div>
      <div class="profile-actions">
        <button class="click-btn" id="profile-btn"></button>
      </div>
      <div class="profile-list"></div>
    </main>
    <script src="../config.js"></script>
    <script src="../src/utils/storage.js"></script>
    <script src="../src/utils/apiFetch.js"></script>
    <script src="../src/utils/helpers.js"></script>
    <script src="../src/api/postApi.js"></script>
    <script src="../src/api/commentApi.js"></script>
    <script src="../src/api/avatarApi.js"></script>
    <script src="../src/api/userApi.js"></script>
    <script src="../src/api/profileApi.js"></script>
    <script src="../src/components/sidebar.js"></script>
    <script src="../src/components/commentModal.js"></script>
    <script src="../src/page/profile.js"></script>
  </body>
</html>
